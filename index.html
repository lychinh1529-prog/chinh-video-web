<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Tải Video TikTok</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        input { width: 90%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; }
        button { width: 95%; padding: 12px; font-size: 16px; background: #fe2c55; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #e0244d; }
        #result { margin-top: 20px; text-align: left; word-break: break-all; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Tải Video Không Logo</h2>
        <input type="text" id="videoUrl" placeholder="Dán link TikTok vào đây...">
        <button onclick="getVid()">Lấy Video</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function getVid() {
            const urlInput = document.getElementById('videoUrl').value;
            const resultDiv = document.getElementById('result');

            if (!urlInput) {
                alert('Vui lòng nhập đường dẫn video!');
                return;
            }

            resultDiv.innerHTML = 'Đang xử lý, vui lòng chờ...';

            try {
                const apiEndpoint = `https://chinh-video-api.onrender.com/api/download?url=${encodeURIComponent(urlInput)}`;
                
                const res = await fetch(apiEndpoint);
                const json = await res.json();

                if (json.code === 0) {
                    const info = json.data;
                    resultDiv.innerHTML = `
                        <hr>
                        <p><b>Tiêu đề:</b> ${info.title}</p>
                        <p><b>Tác giả:</b> ${info.author.nickname}</p>
                        <a href="${info.play}" target="_blank" style="display: block; text-align: center; padding: 12px; background: #00b0ff; color: white; text-decoration: none; border-radius: 5px; margin-top: 10px;">📥 Tải Video Ngay</a>
                    `;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">Lỗi: ${json.msg}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p style="color: red;">Không thể kết nối tới máy chủ API!</p>`;
            }
        }
    </script>

</body>
</html>
